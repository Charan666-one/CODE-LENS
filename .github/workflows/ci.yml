name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy

      # The golden-fixture comparison (CP-0.2) lives here. It is the test the
      # parser must earn its way to passing in CP-1.2, and the alarm that
      # fires on any graph drift thereafter.
      - name: Tests (pytest)
        run: pytest -q

  images:
    name: images (build · boot · analyse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A Dockerfile nothing builds is a Dockerfile that has already rotted.
      # Both of the bugs this job would have caught were invisible to the test
      # suite: an image without `git` starts cleanly and fails on the first
      # analysis, and the frontend bound to $HOSTNAME served fine through a
      # published port while its healthcheck could never pass.
      - name: Build images
        run: docker compose build

      - name: Boot the stack
        run: docker compose up -d --wait --wait-timeout 180

      # The real proof: a repository through the whole pipeline, over the same
      # proxy path a browser uses. `--wait` above already required both
      # healthchecks to pass before this runs.
      - name: Analyse a repository end to end
        run: |
          job=$(curl -sf -X POST http://localhost:3000/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"source":"https://github.com/pallets/itsdangerous"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["job_id"])')
          for _ in $(seq 1 60); do
            body=$(curl -sf "http://localhost:3000/api/analyze/$job")
            state=$(printf '%s' "$body" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            case "$state" in
              done)  printf '%s\n' "$body"; exit 0 ;;
              error) printf '%s\n' "$body"; exit 1 ;;
            esac
            sleep 3
          done
          echo "timed out waiting for analysis"; exit 1

      - name: Server logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
